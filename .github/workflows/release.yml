name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/luxalarm.keystore
          printf 'storeFile=luxalarm.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > app/keystore.properties

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (fallback if Gradle signing didn't apply)
        if: success()
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name "*unsigned*" -o -name "*.apk" | head -n 1)
          if echo "$UNSIGNED" | grep -q "unsigned"; then
            SIGNED="app/build/outputs/apk/release/app-release.apk"
            apksigner sign \
              --ks app/luxalarm.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$SIGNED" \
              "$UNSIGNED"
            echo "APK_PATH=$SIGNED" >> $GITHUB_ENV
          else
            echo "APK_PATH=$UNSIGNED" >> $GITHUB_ENV
          fi

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/local/lib/android* -name apksigner 2>/dev/null | head -1)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          else
            echo "apksigner not found, skipping verification"
          fi

      - name: Upload signed APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
